services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hivibe
      POSTGRES_USER: hivibe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
    volumes:
      - hivibe_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hivibe -d hivibe"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "4300:4300"
    environment:
      PORT: "4300"
      FRONTEND_URL: ${FRONTEND_URL:?Define FRONTEND_URL}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET}
      DATABASE_URL: postgresql://hivibe:${POSTGRES_PASSWORD}@db:5432/hivibe?schema=public
    depends_on:
      db:
        condition: service_healthy

volumes:
  hivibe_postgres_data:
