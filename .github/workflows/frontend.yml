name: Frontend
on:
  push:
    branches: [main, develop, 'codex/**']
    paths: ['apps/web/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['apps/web/**', '.github/workflows/frontend.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
      - run: npm ci --prefix ../api
      - run: npm ci
      - run: node ../api/scripts/setup-local.cjs
      - run: docker compose -f ../api/compose.yaml up -d --build --wait
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_SERVER_COMMAND: npm run start
      - run: npm audit --omit=dev
      - if: always()
        run: docker compose -f ../api/compose.yaml down
